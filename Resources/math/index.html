<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="katex.min.css">
  <script src="marked.min.js"></script>
  <script src="katex.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --text-color: #1d1d1f;
      --secondary-color: #6e6e73;
      --code-bg: rgba(0, 0, 0, 0.05);
      --border-color: rgba(0, 0, 0, 0.12);
      --math-bg: rgba(0, 0, 0, 0.03);
      --link-color: #007aff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text-color: #f5f5f7;
        --secondary-color: #98989d;
        --code-bg: rgba(255, 255, 255, 0.08);
        --border-color: rgba(255, 255, 255, 0.15);
        --math-bg: rgba(255, 255, 255, 0.05);
        --link-color: #0a84ff;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.55;
      user-select: text;
      -webkit-user-select: text;
      word-break: break-word;
      overflow-x: hidden;
    }

    body {
      padding: 2px 2px 8px 2px;
    }

    p {
      margin: 0 0 10px 0;
    }
    p:last-child {
      margin-bottom: 0;
    }

    h1, h2, h3, h4, h5, h6 {
      margin: 14px 0 6px 0;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-color);
    }
    h1 { font-size: 16px; }
    h2 { font-size: 15px; }
    h3 { font-size: 14px; }
    h4 { font-size: 13px; }

    ul, ol {
      margin: 6px 0 10px 0;
      padding-left: 20px;
    }
    li {
      margin-bottom: 4px;
    }

    /* Mathematical Notation Container Styling */
    .math-display {
      display: block;
      margin: 12px 0;
      padding: 10px 14px;
      background: var(--math-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      text-align: center;
      max-width: 100%;
      -webkit-overflow-scrolling: touch;
    }

    .math-display .katex-display {
      margin: 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2px 0;
    }

    .math-inline {
      display: inline-block;
      vertical-align: middle;
      padding: 0 1px;
    }

    /* Scrollbars for wide equations/matrices */
    .math-display::-webkit-scrollbar {
      height: 4px;
    }
    .math-display::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    code {
      font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      background: var(--code-bg);
      padding: 2px 5px;
      border-radius: 4px;
    }

    pre {
      background: var(--code-bg);
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 8px 0;
    }
    pre code {
      background: transparent;
      padding: 0;
    }

    blockquote {
      margin: 10px 0;
      padding: 6px 12px;
      border-left: 3px solid var(--link-color);
      color: var(--secondary-color);
      background: var(--code-bg);
      border-radius: 0 6px 6px 0;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border-color);
      margin: 12px 0;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: 10px 0;
    }
    th, td {
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      text-align: left;
    }
    th {
      background: var(--code-bg);
      font-weight: 600;
    }

    a {
      color: var(--link-color);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="content"></div>

  <script>
    // Config marked
    if (typeof marked !== 'undefined') {
      marked.setOptions({
        gfm: true,
        breaks: true
      });
    }

    function normalizeMathNotation(raw) {
      if (!raw) return '';

      // 1. Wrap standalone \begin{...matrix}...\end{...matrix} or array in $$ if not already inside $$
      let text = raw.replace(/(?<!\$\$|\$)\s*(\\begin\{(?:[a-zA-Z]*matrix|array|cases|aligned)\}[\s\S]*?\\end\{(?:[a-zA-Z]*matrix|array|cases|aligned)\})\s*(?!\$\$|\$)/g, (match, env) => {
        return '\n\n$$' + env.trim() + '$$\n\n';
      });

      // 2. Normalize matrices: Fix collapsed backslashes in matrix rows (e.g., \ 0 -> \\ 0)
      text = text.replace(/\\begin\{([a-zA-Z]*matrix|array)\}([\s\S]*?)\\end\{\1\}/g, (match, env, content) => {
        // Replace single backslash followed by whitespace or numbers with standard double backslash \\
        const fixedContent = content.replace(/(?<!\\)\\\s*(?!\s|hline|text|mathbf|math|frac|sqrt|dots|cdots|vdots|ddots|[a-zA-Z]+)/g, '\\\\ ');
        return `\\begin{${env}}${fixedContent}\\end{${env}}`;
      });

      return text;
    }

    function renderMarkdownWithMath(markdown) {
      const normalized = normalizeMathNotation(markdown);

      const mathBlocks = [];
      const mathInlines = [];

      // Protect display math: $$...$$ or \[...\]
      let text = normalized.replace(/\$\$([\s\S]+?)\$\$/g, (match, math) => {
        const id = mathBlocks.length;
        mathBlocks.push(math.trim());
        return `\n\n%%MATH_BLOCK_${id}%%\n\n`;
      });
      text = text.replace(/\\\[([\s\S]+?)\\\]/g, (match, math) => {
        const id = mathBlocks.length;
        mathBlocks.push(math.trim());
        return `\n\n%%MATH_BLOCK_${id}%%\n\n`;
      });

      // Protect inline math: $...$ or \(...\)
      text = text.replace(/\$([^\$\n]+?)\$/g, (match, math) => {
        const id = mathInlines.length;
        mathInlines.push(math.trim());
        return `%%MATH_INLINE_${id}%%`;
      });
      text = text.replace(/\\\((.+?)\\\)/g, (match, math) => {
        const id = mathInlines.length;
        mathInlines.push(math.trim());
        return `%%MATH_INLINE_${id}%%`;
      });

      // Parse markdown to HTML
      let html = typeof marked !== 'undefined' ? marked.parse(text) : text;

      // Restore display math with KaTeX rendered HTML
      html = html.replace(/<p>\s*%%MATH_BLOCK_(\d+)%%\s*<\/p>|%%MATH_BLOCK_(\d+)%%/g, (match, id1, id2) => {
        const id = parseInt(id1 !== undefined ? id1 : id2, 10);
        const math = mathBlocks[id];
        if (typeof katex !== 'undefined') {
          try {
            return `<div class="math-display">${katex.renderToString(math, { displayMode: true, throwOnError: false })}</div>`;
          } catch (e) {
            return `<div class="math-display">${math}</div>`;
          }
        }
        return `<div class="math-display">$$${math}$$</div>`;
      });

      // Restore inline math with KaTeX rendered HTML
      html = html.replace(/%%MATH_INLINE_(\d+)%%/g, (match, idStr) => {
        const id = parseInt(idStr, 10);
        const math = mathInlines[id];
        if (typeof katex !== 'undefined') {
          try {
            return `<span class="math-inline">${katex.renderToString(math, { displayMode: false, throwOnError: false })}</span>`;
          } catch (e) {
            return `<span class="math-inline">$${math}$</span>`;
          }
        }
        return `<span class="math-inline">$${math}$</span>`;
      });

      return html;
    }

    function renderContent(markdown) {
      const container = document.getElementById('content');
      if (container) {
        container.innerHTML = renderMarkdownWithMath(markdown);
        notifyHeight();
      }
    }

    function notifyHeight() {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.contentHeight) {
        const height = Math.ceil(document.body.scrollHeight);
        window.webkit.messageHandlers.contentHeight.postMessage(height);
      }
    }

    window.addEventListener('resize', notifyHeight);
  </script>
</body>
</html>
